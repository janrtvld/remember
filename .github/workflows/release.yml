name: Publish Remember release

on:
  workflow_dispatch:

run-name: Publish Remember release from ${{ github.ref_name }} by @${{ github.actor }}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check build prerequisites
        run: bash scripts/ci/check-mac-runner.sh
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - name: Verify signing and notarization secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID SENTRY_AUTH_TOKEN; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required release secrets: ${missing[*]}"
            exit 1
          fi
      - name: Verify public release version
        run: node apps/desktop/scripts/verify-release-version.cjs
      - run: pnpm install --frozen-lockfile
      - name: Validate release commit
        timeout-minutes: 15
        run: |
          pnpm format:check
          pnpm lint
          pnpm exec turbo run types:check --concurrency=1
          pnpm exec turbo run test --concurrency=1
      # electron-builder 26.15.3 creates its temporary keychain with a random
      # password, then passes the P12 password to set-key-partition-list. That
      # becomes flaky when macOS locks the keychain between those commands.
      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          keychain: ${{ runner.temp }}/remember-signing-${{ github.run_id }}
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Verify signing identity
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEYCHAIN: ${{ runner.temp }}/remember-signing-${{ github.run_id }}.keychain
        run: |
          if ! security find-identity -v -p codesigning "$CSC_KEYCHAIN" | grep -Fq "($APPLE_TEAM_ID)"; then
            echo "::error::Imported keychain does not contain the expected signing identity."
            exit 1
          fi
      - name: Prepare signed and notarized update artifacts
        timeout-minutes: 30
        run: pnpm --filter @remember/desktop package
        env:
          CSC_KEYCHAIN: ${{ runner.temp }}/remember-signing-${{ github.run_id }}.keychain
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Publish the verified prepared artifacts
        timeout-minutes: 15
        run: pnpm --filter @remember/desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: jr-development-0f
          SENTRY_PROJECT: remember-desktop
