name: Deploy website to Cloudflare

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --filter @remember/site... --filter remember --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @remember/site types:check
      - name: Build production
        if: github.ref == 'refs/heads/main'
        run: pnpm --filter @remember/site build:vinext
      - name: Deploy production
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_API_TOKEN }}
        run: pnpm --filter @remember/site deploy:ci
      - name: Check production
        if: github.ref == 'refs/heads/main'
        run: pnpm --filter @remember/site check:deployment https://www.remember.computer
      - name: Build and deploy branch preview
        if: github.ref != 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_API_TOKEN }}
          PREVIEW_BRANCH: ${{ github.ref_name }}
        run: |
          preview_name="branch-$(printf '%s' "$PREVIEW_BRANCH" | sha256sum | cut -c1-12)"
          pnpm --filter @remember/site exec cf previews deploy "$preview_name"
          preview_url="https://${preview_name}-remember-site.jan-d4f.workers.dev"
          pnpm --filter @remember/site check:deployment "$preview_url"
          printf 'Preview: %s\n' "$preview_url" >> "$GITHUB_STEP_SUMMARY"
